name: AI Devops Assistant-CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install security scanning tools
        run: |
          pip install bandit pip-audit

      - name: Run Bandit code security scan
        run: |
          bandit -r backend -x backend/__pycache__

      - name: Run dependency vulnerability scan
        run: |
          pip-audit -r backend/requirements.txt

      - name: Validate Python files
        run: |
          python -m compileall backend

      - name: Build Docker image
        run: |
          docker build \
            -t ankeshhkumar/ai-devops-assistant:${{ github.sha }} \
            ./backend

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ankeshhkumar/ai-devops-assistant:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: |
            CVE-2025-47273
            GHSA-6v7p-g79w-8964

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ankeshhkumar/ai-devops-assistant:${{ github.sha }}
