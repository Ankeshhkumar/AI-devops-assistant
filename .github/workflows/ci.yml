name: AI Devops Assistant-CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "git-ops/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ankeshhkumar/ai-devops-assistant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit pip-audit

      - name: Bandit code security scan
        run: bandit -r backend -x backend/__pycache__

      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt

      - name: Validate Python files
        run: python -m compileall backend

  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (amd64 + arm64, SHA tag only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  update-manifests:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set new image tag
        run: |
          sed -i "s|image: .*/ai-devops-assistant:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" \
            git-ops/ai-devops-gitops/backend-deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add git-ops
          git diff --cached --quiet || git commit -m "ci: deploy ${{ github.sha }}"
          git pull --rebase origin main
          git push
