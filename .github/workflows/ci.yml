name: AI Devops Assistant CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python files
        run: |
          python -m compileall backend

      - name: Build Docker image
        run: |
          docker build -t ankeshhkumar/ai-devops-assistant:3ff1e3522546de67c8e20c169024250cf7997f64 ./backend

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          docker push ankeshhkumar/ai-devops-assistant:3ff1e3522546de67c8e20c169024250cf7997f64
