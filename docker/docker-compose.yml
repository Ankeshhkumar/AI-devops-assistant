
version: "3.9"

services:
  postgres:
    image: postgres:14
    container_name: ai-postgres
    restart: always
    environment:
      POSTGRES_DB: ai_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    container_name: ai-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_NAME: ai_chat
      DB_USER: postgres
      DB_PASSWORD: postgres
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
  grafana:
    image: grafana/grafana:latest
    container_name: ai-grafana
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data:

