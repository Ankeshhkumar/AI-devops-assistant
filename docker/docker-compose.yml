version: "3.9"

services:
  postgres:
    image: postgres:14
    container_name: ai-postgres
    restart: always
    environment:
      POSTGRES_DB: ai_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ../backend
    container_name: ai-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_NAME: ai_chat
      DB_USER: postgres
      DB_PASSWORD: postgres
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

volumes:
  postgres_data:
